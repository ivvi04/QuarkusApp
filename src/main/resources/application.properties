quarkus.log.file.enable=true
quarkus.log.file.path=logs/app.log
quarkus.log.file.encoding=UTF-8
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] %s%n

# Ротация по дате — каждый день новый файл
quarkus.log.file.rotation.max-backup-index=7
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=true

#PostgreSQL Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/quarkus_db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.devservices.enabled=false

#Hibernate Configuration
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=quarkus_app

#Liquibase Configuration
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.contexts=*
quarkus.liquibase.change-log=db/changelog/changelog-master.xml
quarkus.liquibase.default-schema-name=quarkus_app
quarkus.liquibase.enabled=true

#RabbitMQ Configuration
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=rmuser
rabbitmq-password=rmpassword
quarkus.rabbitmq.devservices.enabled=false

# Входящий канал (consumer)
quarkus.messaging.incoming.order-events-in.connector=smallrye-rabbitmq
quarkus.messaging.incoming.order-events-in.queue=order.events.queue
quarkus.messaging.incoming.order-events-in.declare=true

# Исходящий канал (producer)
quarkus.messaging.outgoing.order-events-out.connector=smallrye-rabbitmq
quarkus.messaging.outgoing.order-events-out.exchange=events.exchange
quarkus.messaging.outgoing.order-events-out.declare=true
quarkus.messaging.outgoing.order-events-out.routing-key=order.registered