quarkus.http.test-port=0
quarkus.test.integration-test-profile=integration-test
# --- Юнит-тесты (профиль test) — H2 ---
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS QUARKUS_APP
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.database.default-schema=QUARKUS_APP
%test.quarkus.liquibase.enabled=false
%test.quarkus.rabbitmq.devservices.enabled=true
# --- Интеграционные тесты (профиль integration-test) — DevServices ---
%integration-test.quarkus.datasource.devservices.enabled=true
%integration-test.quarkus.datasource.db-kind=postgresql
%integration-test.quarkus.datasource.devservices.init-script-path=db/changelog/baseline/init/init.sql
%integration-test.quarkus.hibernate-orm.schema-management.strategy=none
%integration-test.quarkus.hibernate-orm.database.default-schema=quarkus_app
%integration-test.quarkus.rabbitmq.devservices.enabled=true